<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trading Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1f262d;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --green: #2ea043;
    --red: #f85149;
    --orange: #d29922;
    --blue: #58a6ff;
    --gold: #d4af37;
    --navy: #4a6ea8;
    --silver: #888;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", sans-serif;
    font-size: 13px; line-height: 1.45;
  }
  .header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap:wrap;
  }
  .title-block .title { font-size: 20px; font-weight: 600; }
  .title-block .subtitle { font-size: 12px; color: var(--muted); }
  .nav a {
    color: var(--blue); text-decoration: none; margin-left: 16px; font-size: 13px;
  }
  .nav a:hover { text-decoration: underline; }
  .nav a.active { color: var(--text); font-weight: 600; }

  .container { padding: 16px 24px; max-width: 1500px; margin: 0 auto; }

  .macro-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px; margin-bottom: 16px;
  }
  .macro-cell {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px;
  }
  .macro-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .macro-value { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .gold { color: var(--gold); } .navy { color: var(--navy); } .silver { color: var(--silver); }
  .green { color: var(--green); } .red { color: var(--red); } .orange { color: var(--orange); }
  .muted { color: var(--muted); }

  h2 { font-size: 14px; font-weight: 600; margin: 24px 0 8px; color: var(--text); }
  h2 .meta { font-size: 11px; font-weight: normal; color: var(--muted); margin-left: 8px; }

  .sleeves {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .sleeve {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .sleeve.bad { border-color: rgba(248, 81, 73, 0.3); }
  .sleeve.good { border-color: rgba(46, 160, 67, 0.3); }
  .sleeve-name {
    font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline;
  }
  .sleeve-name .badge { font-size: 11px; color: var(--muted); font-weight: normal; }
  .sleeve-row {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 12px;
  }
  .sleeve-row .k { color: var(--muted); }
  .sleeve-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .sleeve-summary {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
  }

  table {
    width: 100%; border-collapse: collapse; margin-top: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    font-size: 12px;
  }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--panel2); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sys-pill {
    display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px;
    font-weight: 700; letter-spacing: 0.4px;
  }
  .sys-LL { background: #4a6ea822; color: #7fa8e6; border: 1px solid #4a6ea8; }
  .sys-ST { background: #2ea04322; color: #6cd47f; border: 1px solid #2ea043; }
  .sys-MR { background: #d4504022; color: #ee8a7a; border: 1px solid #d45040; }
  .side-LONG { color: var(--green); font-weight: 600; }
  .side-SHORT { color: var(--red); font-weight: 600; }

  .footer { padding: 24px; text-align: center; color: var(--muted); font-size: 11px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="header">
  <div class="title-block">
    <div class="title">Trading Dashboard</div>
    <div class="subtitle">MR · LL · ST · RF — paper-tracked sleeves</div>
  </div>
  <div class="nav">
    <a href="index.html">EQM Risk</a>
    <a href="trading.html" class="active">Trading</a>
  </div>
</div>

<div class="container">
  <div id="macro-bar" class="macro-bar"></div>

  <h2>Strategy sleeves <span class="meta" id="sleeve-meta"></span></h2>
  <div id="sleeves" class="sleeves"></div>

  <h2>Open positions <span class="meta" id="open-meta"></span></h2>
  <div id="open-table"></div>

  <h2>Closed last 30 days <span class="meta" id="closed-meta"></span></h2>
  <div id="closed-table"></div>
</div>

<div class="footer" id="footer">loading…</div>

<script>
const fmtPct = (x) => (x === null || x === undefined) ? '—' : (x >= 0 ? '+' : '') + x.toFixed(2) + '%';
const fmtNum = (x, d=4) => (x === null || x === undefined) ? '—' : Number(x).toFixed(d);
const colorPct = (x) => x == null ? 'muted' : (x > 0 ? 'green' : (x < 0 ? 'red' : 'muted'));

function macroCell(label, value, color) {
  return `<div class="macro-cell"><div class="macro-label">${label}</div><div class="macro-value ${color || ''}">${value}</div></div>`;
}

function renderMacro(m) {
  const el = document.getElementById('macro-bar');
  const stateColor = (s) => s === 'gold' ? 'gold' : (s === 'navy' ? 'navy' : 'silver');
  const ma200pct = m.btc_ma200 ? ((m.btc_price/m.btc_ma200 - 1) * 100).toFixed(1) : null;
  const cells = [
    macroCell('BTC', '$' + (m.btc_price ? m.btc_price.toLocaleString() : '—'), m.btc_above_ma200 ? 'green' : 'red'),
    macroCell('Macro Regime', m.macro_regime, m.macro_regime === 'BULL' ? 'green' : 'red'),
    macroCell('BTC vs MA200', ma200pct ? (ma200pct > 0 ? '+' : '') + ma200pct + '%' : '—', m.btc_above_ma200 ? 'green' : 'red'),
    macroCell('BTC LL', (m.btc_state || '—').toUpperCase(), stateColor(m.btc_state)),
    macroCell('ETH LL', (m.eth_state || '—').toUpperCase(), stateColor(m.eth_state)),
    macroCell('M2 YoY', (m.m2_yoy ?? '—') + '%', m.m2_long_gate_open ? 'green' : 'red'),
    macroCell('Vol pct (1y)', m.btc_vol_pct_1y ?? '—', 'muted'),
    macroCell('BTC RSI14', m.btc_rsi14 ?? '—', m.btc_rsi14 > 70 ? 'red' : (m.btc_rsi14 < 30 ? 'green' : 'muted')),
    macroCell('LONG entries', m.lenient_long_blocked ? 'BLOCKED' : 'allowed', m.lenient_long_blocked ? 'red' : 'green'),
    macroCell('SHORT entries', m.lenient_short_blocked ? 'BLOCKED' : 'allowed', m.lenient_short_blocked ? 'red' : 'green'),
  ];
  el.innerHTML = cells.join('');
}

function sleeveCard(name, s) {
  const cls = (s.sum_pct > 0) ? 'good' : (s.sum_pct < 0 ? 'bad' : '');
  const col = colorPct(s.sum_pct);
  const wr = s.wr === null ? '—' : s.wr + '%';
  return `
    <div class="sleeve ${cls}">
      <div class="sleeve-name">
        <span>${name}</span>
        <span class="badge">${s.n_open} open · ${s.n_closed} closed</span>
      </div>
      <div class="sleeve-row"><span class="k">trades</span><span class="v">${s.n_total}</span></div>
      <div class="sleeve-row"><span class="k">win rate</span><span class="v">${wr}</span></div>
      <div class="sleeve-row"><span class="k">avg / trade</span><span class="v ${colorPct(s.avg_pct)}">${fmtPct(s.avg_pct)}</span></div>
      <div class="sleeve-row"><span class="k">realized</span><span class="v ${colorPct(s.realized_sum)}">${fmtPct(s.realized_sum)}</span></div>
      <div class="sleeve-row"><span class="k">unrealized</span><span class="v ${colorPct(s.unrealized_sum)}">${fmtPct(s.unrealized_sum)}</span></div>
      <div class="sleeve-summary ${col}">${fmtPct(s.sum_pct)}</div>
    </div>`;
}

function renderSleeves(summary) {
  const el = document.getElementById('sleeves');
  const order = ['MR', 'LL', 'ST'];
  el.innerHTML = order.map(k => sleeveCard(k, summary[k])).join('');
  const total = order.reduce((a, k) => a + (summary[k].sum_pct || 0), 0);
  const totalN = order.reduce((a, k) => a + (summary[k].n_total || 0), 0);
  document.getElementById('sleeve-meta').innerText = `${totalN} trades · combined ${fmtPct(total)}`;
}

function renderOpen(trades) {
  const el = document.getElementById('open-table');
  if (!trades.length) { el.innerHTML = '<div class="empty">No open positions.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>SYS</th><th>COIN</th><th>SIDE</th><th>ENTRY DATE</th>
        <th class="num">ENTRY</th><th class="num">MARK</th>
        <th class="num">SL</th><th class="num">TP</th>
        <th class="num">PnL%</th>
      </tr></thead>
      <tbody>
        ${trades.map(t => `<tr>
          <td><span class="sys-pill sys-${t.sys}">${t.sys}</span></td>
          <td><b>${t.coin}</b></td>
          <td><span class="side-${t.side}">${t.side}</span></td>
          <td>${t.entry_date}</td>
          <td class="num">${fmtNum(t.entry, 4)}</td>
          <td class="num">${fmtNum(t.mark, 4)}</td>
          <td class="num">${fmtNum(t.sl, 4)}</td>
          <td class="num">${fmtNum(t.tp, 4)}</td>
          <td class="num ${colorPct(t.pnl_pct)}"><b>${fmtPct(t.pnl_pct)}</b></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  document.getElementById('open-meta').innerText = `${trades.length} positions`;
}

function renderClosed(trades) {
  const el = document.getElementById('closed-table');
  if (!trades.length) { el.innerHTML = '<div class="empty">No closes in last 30 days.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>SYS</th><th>COIN</th><th>SIDE</th><th>ENTRY DATE</th>
        <th class="num">ENTRY</th><th class="num">EXIT</th>
        <th class="num">DAYS</th><th>REASON</th>
        <th class="num">PnL%</th>
      </tr></thead>
      <tbody>
        ${trades.map(t => `<tr>
          <td><span class="sys-pill sys-${t.sys}">${t.sys}</span></td>
          <td><b>${t.coin}</b></td>
          <td><span class="side-${t.side}">${t.side}</span></td>
          <td>${t.entry_date}</td>
          <td class="num">${fmtNum(t.entry, 4)}</td>
          <td class="num">${fmtNum(t.exit, 4)}</td>
          <td class="num">${t.held_days}</td>
          <td>${t.reason || '—'}</td>
          <td class="num ${colorPct(t.pnl_pct)}"><b>${fmtPct(t.pnl_pct)}</b></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  const realized = trades.reduce((a, t) => a + t.pnl_pct, 0);
  document.getElementById('closed-meta').innerText = `${trades.length} closes · realized ${fmtPct(realized)}`;
}

async function load() {
  try {
    const r = await fetch('dashboard_data.json?t=' + Date.now());
    const d = await r.json();
    renderMacro(d.macro);
    renderSleeves(d.summary);
    renderOpen(d.open_trades);
    renderClosed(d.closed_trades);
    const dt = new Date(d.generated_at);
    document.getElementById('footer').innerText =
      `Updated: ${dt.toISOString().slice(0,19).replace('T',' ')} UTC · paper-tracked sleeves only — no real-money account state shown`;
  } catch (e) {
    document.getElementById('footer').innerText = 'Failed to load dashboard_data.json: ' + e.message;
  }
}
load();
</script>
</body>
</html>
