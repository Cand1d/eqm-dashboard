name: Update & Deploy EQM Dashboard
on:
  schedule:
    - cron: '5 6 * * *'  # daily at 06:05 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance requests
      - run: python eqm_dashboard.py
      - run: cp eqm_dashboard.html index.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check EQM Risk & Alert
        id: risk_check
        continue-on-error: true
        run: python check_risk_alert.py
      - name: Send email alert if high risk
        if: steps.risk_check.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "EQM ALERT: Extreme Risk Zone (>90%) detected"
          to: christophpp@gmail.com
          from: EQM Dashboard <christophpp@gmail.com>
          body: |
            One or more assets have entered the EQM Extreme Risk Zone (>90%).

            Check the dashboard: https://cand1d.github.io/eqm-dashboard/

            This alert was triggered by the daily EQM dashboard update.
      - name: Keepalive (prevent 60-day inactivity disable)
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
